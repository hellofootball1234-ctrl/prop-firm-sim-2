<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Prop Firm Evaluation</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="locked">
  <h2>🔒 Private Access</h2>
  <p>Unauthorized access denied.</p>
</div>

<div id="app" style="display:none;">
  <h1>📊 Prop Firm Evaluation</h1>

  <h3 id="phaseTitle">Phase 1</h3>

  <div class="rules">
    <p>💰 Account Size: $10,000</p>
    <p>🎯 Profit Target: <span id="profitTarget">8%</span></p>
    <p>📉 Max Daily Loss: 5%</p>
    <p>🚫 Max Overall Loss: 10%</p>
  </div>

  <div class="stats">
    <p>Balance: $<span id="balance">10000</span></p>
    <p>Profit: $<span id="profit">0</span></p>
  </div>

  <h3>➕ Log Trade Result</h3>
  <input type="number" id="tradeResult" placeholder="Profit / Loss ($)" />
  <button onclick="logTrade()">Submit Trade</button>

  <p id="status"></p>

  <hr />
  <h3>📥 MT5 Demo</h3>
  <a href="https://www.metatrader5.com/en/download" target="_blank">
    Download MT5
  </a>
</div>

<script src="app.js"></script>
</body>
</html>
